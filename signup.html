<!doctype html>
<htm>
  <head></head>
  <body>
    <main>
      <video autoplay muted loop id="myVideo">
        <source src="Background Video.mp4" type="video/mp4" />
      </video>
      <section>
        <h2>Write your name in the link</h2>
        <p>Join the fandom and let your words find their readers.</p>
      </section>

      <section>
        <div>
          <form action="signup.html">
            <input
              type="text"
              name="Username"
              id="username"
              placeholder="Username"
            />
          </form>

          <form action="signup.html">
            <input type="email" name="email" placeholder="Email" id="email" />
          </form>

          <form action="signup.html">
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
            />
          </form>

          <form action="signup.html">
            <input
              type="password"
              name="confirm-password"
              id="confirm-password"
              placeholder="Confirm Password"
            />
          </form>
          <a href="Forget Password.html">Forget password</a><br />

          <a href="home.html">
            <button>Begin Your Chapter</button>
          </a>

          <p>Already one of us?
          <a href="home.html"> <span><button>Step Back In</button></span>
          </a></p>
        </div>
      </section>
    </main>
  </body>
</htm>
